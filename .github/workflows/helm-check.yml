name: World of Chewing Gum (Iac)Github Workflow

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  docker-compose-test:
    name: Build and Validate Docker Compose
    runs-on: ubuntu-latest

    env:
      MYSQL_DATABASE: world_of_chewing_gum
      MYSQL_USER: chewinggum
      MYSQL_PASSWORD: chewing_user
      MYSQL_ROOT_PASSWORD: Pinapple@OneShot#2026
      JWT_SECRET: 695fe895d0c696dee4609e5ba833727ea250574fc289091ffc1d64b7f90623ca

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Compose Config Prüfen (Syntax Check)
        run: |
          echo "🔍 Überprüfe docker-compose.yml Syntax..."
          docker compose config

      - name: Container bauen und starten
        run: |
          echo "🚀 Baue Images und starte Container..."
          docker compose up -d --build

      - name: Dienst-Gesundheit prüfen (Wait for MySQL & Backend)
        run: |
          echo "⏳ Warte darauf, dass MySQL und Backend bereit sind..."
          sleep 15
          docker compose ps

      - name: Container Logs ausgeben (bei Fehler / Debug)
        if: always()
        run: |
          echo "📜 Container Status & Logs:"
          docker compose logs

      - name: Container stoppen und aufräumen
        if: always()
        run: |
          echo "🧹 Stoppe und entferne Container..."
          docker compose down -v
