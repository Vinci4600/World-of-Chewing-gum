name: CI/CD Pipeline - World of Chewing Gum

on:
  push:
    branches: [ "main","dev" ]
  pull_request:
    branches: [ "main","dev" ]

# Erlaubt dem GITHUB_TOKEN, Packages zu schreiben (nötig für GHCR push)
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js Umgebung einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren & bauen
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build

  docker-build:
    needs: test-and-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    # Optional: klarere Job-Berechtigungen (Workflow-Ebene reicht meist)
    permissions:
      contents: read
      packages: write

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadaten generieren
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Docker Image bauen und pushen
        uses: docker/build-push-action@v5
        with:
          # Wichtig: passe den Kontext an. Wenn dein Dockerfile im Repo-Root liegt, verwende "./".
          # Wenn dein Dockerfile in einem Unterordner liegt (z.B. "mein-react-template"), setze den Pfad hier.
          context: .
          # Wenn dein Dockerfile anders heißt oder nicht im Kontext-Root liegt, kannst du z.B. file: './Pfad/Dockerfile' hinzufügen
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
