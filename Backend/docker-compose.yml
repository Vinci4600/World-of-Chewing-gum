services:
  mysql:
    image: mysql:8.4
    container_name: woc-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: world_of_chewing_gum
      MYSQL_USER: chewinggum
      MYSQL_PASSWORD: chewing_user
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - chewinggum_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chewinggum_mysql_data:
    driver: local