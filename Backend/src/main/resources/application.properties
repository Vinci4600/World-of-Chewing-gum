spring.application.name=Backend
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# Local defaults match the Docker compose database created in the project root.
spring.datasource.username=${MYSQL_USER:chewinggum}
spring.datasource.password=${MYSQL_PASSWORD:chewing_user}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/world_of_chewing_gum?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
# JWT
jwt.secret=${JWT_SECRET:695fe895d0c696dee4609e5ba833727ea250574fc289091ffc1d64b7f90623ca}
jwt.expiration=860000

# JPA / Hibernate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${SERVER_PORT:8080}

#Passwiort vergessen was geschickt wird wenn der code ankommt
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
