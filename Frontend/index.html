<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./public/Last.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title style="background-color: brown">One-Shot-World of Chewing Gum</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      function updateTitle() {
        const path = window.location.pathname;

        if (path.includes('/kaugummiPage')) {
          document.title = "Kaugummis-World of Chewing Gum";
        } else if (path.includes('/login')) {
          document.title = "Login- World of Chewing Gum";
        } else if (path.includes('/register')) {
          document.title = "Register- World of Chewing Gum";
        }
        else if(path.includes('/kaugummiadd')) {
          document.title = "Kaugummi hinzufügen- World of Chewing Gum";
        }
        else if(path.includes('/benutzerangaben')) {
          document.title = "Meine Users -World of Chewing Gum";
        }
        else  if(path.includes("/forgotpassword")) {
          document.title = "Password vergessen? - World of Chewing Gum";
        }
        else if(path.includes("/verify-code")) {
          document.title = "E-Mail Code überprüfen - World of Chewing Gum";
        }
        else if(path.includes("/favorites")) {
          document.title = "Meine Favorite Kaugummis - World of Chewing Gum";
        }
        else if(path.includes("/register")) {
          document.title = "Register - World of Chewing Gum";
        }
        else if(path.includes("/kaugummi/:id")) {
          document.title = "Kaugummidetails - World of Chewing Gum";
        }
        else if(path.includes("/kaugummiedit/:id")) {
          document.title = "Kaugummis bearbeiten - World of Chewing Gum";
        }


                else {
          document.title = "Home-World of Chewing Gum";
        }
      }

      // Für reguläre Navigations-Events
      window.addEventListener('popstate', updateTitle);
      document.addEventListener('DOMContentLoaded', updateTitle);

      // Observer für SPA-Routenänderungen im React-Root
      const observer = new MutationObserver(updateTitle);
      document.addEventListener('DOMContentLoaded', () => {
        const root = document.getElementById('root');
        if (root) {
          observer.observe(root, { childList: true, subtree: true });
        }
      });



    </script>

  </body>
</html>
